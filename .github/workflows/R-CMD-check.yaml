name: R package and bridge contract
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile: [minimal, full]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: "false"
      DATARAFT_IDE_TEST_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          r-version: '4.5.1'
          use-public-rspm: false
      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
      - name: Install pinned dependencies
        shell: Rscript {0}
        run: |
          options(repos = c(CRAN = "https://packagemanager.posit.co/cran/__linux__/noble/2026-09-18"))
          install.packages(c("remotes", "rcmdcheck", "testthat", "withr", "knitr", "rmarkdown"))
          full <- Sys.getenv("DATARAFT_IDE_TEST_PROFILE") == "full"
          remotes::install_deps(dependencies = if (full) TRUE else NA, upgrade = "never")
      - name: Check package including examples and tests
        shell: Rscript {0}
        run: |
          full <- Sys.getenv("DATARAFT_IDE_TEST_PROFILE") == "full"
          Sys.setenv(`_R_CHECK_FORCE_SUGGESTS_` = if (full) "true" else "false")
          if (full) {
            suggests <- read.dcf("DESCRIPTION", fields = "Suggests")[[1]]
            packages <- trimws(gsub("\\s*\\([^)]*\\)", "", strsplit(suggests, ",")[[1]]))
            missing <- packages[!vapply(packages, requireNamespace, logical(1), quietly = TRUE)]
            if (length(missing)) stop("Missing full-profile dependencies: ", paste(missing, collapse = ", "))
          }
          rcmdcheck::rcmdcheck(args = "--no-manual", error_on = "warning")
      - name: Generate real response fixtures
        if: matrix.profile == 'full'
        shell: Rscript {0}
        run: |
          install.packages(".", repos = NULL, type = "source")
          library(dataraft.ide)
          source("tools/generate-fixtures.R")
      - name: Validate strict response schemas
        if: matrix.profile == 'full'
        run: |
          python -m pip install jsonschema==4.26.0
          python tools/validate-schema.py
