name: R package and bridge contract
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, profile: minimal}
          - {os: ubuntu-24.04, profile: full}
          - {os: windows-latest, profile: minimal}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      FAMILY_BRANCH: ${{ github.head_ref }}
      DATARAFT_FAMILY_MODE: ${{ github.event_name == 'pull_request' && 'head' || 'pinned' }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: "false"
      DATARAFT_IDE_TEST_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Obtain family sources from the central manifest
        run: python scripts/checkout-family.py dataraft.ide
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          r-version: '4.5.1'
          use-public-rspm: false
      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
      - name: Install pinned dependencies
        shell: Rscript {0}
        run: |
          snapshot <- if (.Platform$OS.type == "windows") {
            "https://packagemanager.posit.co/cran/2026-09-18"
          } else {
            "https://packagemanager.posit.co/cran/__linux__/noble/2026-09-18"
          }
          options(repos = c(CRAN = snapshot))
          install.packages(c("remotes", "rcmdcheck", "testthat", "withr", "knitr", "rmarkdown"))
          full <- Sys.getenv("DATARAFT_IDE_TEST_PROFILE") == "full"
          names <- if (full) c("core", "lake", "metrics", "dbt", "adapters") else "core"
          paths <- file.path("family", paste0("dataraft.", names))
          descriptions <- c(file.path(paths, "DESCRIPTION"), "DESCRIPTION")
          fields <- if (full) c("Imports", "Suggests") else "Imports"
          dependencies <- unique(unlist(lapply(descriptions, function(path) {
            entries <- read.dcf(path, fields = fields)
            trimws(gsub("\\s*\\([^)]*\\)", "", unlist(strsplit(paste(entries[!is.na(entries)], collapse = ","), ","))))
          })))
          external <- dependencies[nzchar(dependencies) & !startsWith(dependencies, "dataraft.")]
          install.packages(setdiff(external, rownames(installed.packages())))
          for (path in paths) {
            stopifnot(system2(file.path(R.home("bin"), "R"), c("CMD", "INSTALL", shQuote(path))) == 0L)
          }
      - name: Check package including examples and tests
        shell: Rscript {0}
        run: |
          full <- Sys.getenv("DATARAFT_IDE_TEST_PROFILE") == "full"
          Sys.setenv(`_R_CHECK_FORCE_SUGGESTS_` = if (full) "true" else "false")
          if (full) {
            suggests <- read.dcf("DESCRIPTION", fields = "Suggests")[[1]]
            packages <- trimws(gsub("\\s*\\([^)]*\\)", "", strsplit(suggests, ",")[[1]]))
            missing <- packages[!vapply(packages, requireNamespace, logical(1), quietly = TRUE)]
            if (length(missing)) stop("Missing full-profile dependencies: ", paste(missing, collapse = ", "))
          }
          rcmdcheck::rcmdcheck(args = "--no-manual", error_on = "warning")
      - name: Generate real response fixtures
        if: matrix.profile == 'full'
        shell: Rscript {0}
        run: |
          install.packages(".", repos = NULL, type = "source")
          library(dataraft.ide)
          source("tools/generate-fixtures.R")
      - name: Validate strict response schemas
        if: matrix.profile == 'full'
        run: |
          python -m pip install jsonschema==4.26.0
          python tools/validate-schema.py
